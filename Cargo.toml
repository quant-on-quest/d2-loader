[package]
name = "d2_loader"
version = "0.4.0"
edition = "2021"

[lib]
name = "d2_loader"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# abi3-py311 builds against the stable ABI, so one wheel per platform covers
# 3.11 and every later CPython. The Python boundary is crossed once per call
# (arrow IPC bytes in, a polars DataFrame out), so the limited API costs
# nothing measurable here and removes the per-version wheel matrix entirely.
pyo3 = { version = "0.29", features = ["abi3-py311"] }
encoding_rs = "0.8"
memchr = "2"
rayon = "1.10"
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }
futures = "0.3"
arrow = { version = "55", features = ["ipc"] }
chrono = "0.4"

# 解析热路径大量调用 memchr，跨 crate 内联对吞吐影响明显
[profile.release]
lto = true
codegen-units = 1
